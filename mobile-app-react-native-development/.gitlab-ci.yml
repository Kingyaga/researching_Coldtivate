stages:
  - dependencies
  - test
  - build
  - deploy

image: ${CI_REGISTRY_IMAGE}:ci

###
## Template Scripts
###

.wait-for-emulator: &wait-for-emulator
  - while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do sleep 2; done; sleep 10 # Lets wait for the emulator a bit more, just to be sure it's ready

.yarn-install: &yarn-install
  - yarn config set cache-folder ~/.yarn
  - yarn install --frozen-lockfile

.bundler-install: &bundler-install
  - gem install bundler -v 2.4.22
  - bundler config set path ~/.bundler
  - bundler install

.trust-git-providers: &trust-git-providers
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
  - ssh-keyscan github.com >> ~/.ssh/known_hosts

.git-secret-reveal: &git-secret-reveal
  - if [ "$GIT_SECRET_GPG_PATH" == "" ]; then echo "GIT SECRET GPG PATH NOT DEFINED"; exit 1; fi;
  - if [ "$GIT_SECRET_GPG_PASSWORD" == "" ]; then echo "GIT SECRET GPG PASSWORD NOT DEFINED"; exit 1; fi;
  - gpg --batch --passphrase "${GIT_SECRET_GPG_PASSWORD}" --import "$GIT_SECRET_GPG_PATH";
  - git secret reveal -p "$GIT_SECRET_GPG_PASSWORD";

###
## Caches
###

.yarn-cache: &yarn-cache
  key: yarn-cache
  policy: pull
  paths:
    - node_modules/
    - ~/.yarn
.gradle-cache: &gradle-cache
  key: gradle-cache
  policy: pull
  paths:
    - ~/.gradle/caches
    - ~/.gradle/wrapper
.android-cache: &android-cache
  key: android-cache
  policy: pull
  paths:
    - android/.gradle
    - android/build
    - android/app/build
.cocoapods-cache: &cocoapods-cache
  key:
    files:
      - ios/App/Podfile.lock
  policy: pull
  paths:
    - ios/App/Pods
.bundler-cache: &bundler-cache
  key: bundler-cache
  policy: pull
  paths:
    - ~/.bundler

# TODO: add Xcode project cache

###
## CI Dependencies
###

build ci image:
  stage: dependencies
  image: docker:25.0.3
  services:
    - docker:25.0.3-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: '/certs'
  before_script:
    - command -v docker && docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" registry.gitlab.com
  script:
    - docker pull ${CI_REGISTRY_IMAGE}:ci || true
    - docker build --cache-from "${CI_REGISTRY_IMAGE}:ci" --tag "${CI_REGISTRY_IMAGE}:ci" --file ./docker/ci/Dockerfile.debian-based ./docker/ci
    - docker push "${CI_REGISTRY_IMAGE}:ci"
  only:
    # refs:
    #   - main
    #   - development
    #   - feat/*
    changes:
      - docker/ci/*

###
## Validation
###

